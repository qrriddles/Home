<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#f7f5ef">
<title>随心的小尝试</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif;color:#34483f;background:#f7f5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#e8eee5,transparent 36%),#f7f5ef}.wrap{max-width:720px;margin:auto;padding:60px 22px 70px}.top{text-align:center}.seal{display:inline-grid;place-items:center;width:46px;height:46px;border:1px solid #a26b5d;color:#a26b5d;border-radius:12px;font-family:serif;font-size:23px;transform:rotate(-5deg)}h1{font-family:serif;font-size:clamp(30px,7vw,43px);font-weight:500;letter-spacing:.11em;margin:22px 0 12px}.subtitle{font-size:14px;color:#7a877d;line-height:1.8;margin:0}.rule{width:65px;height:1px;background:#bac9ba;margin:28px auto 36px}.list{display:grid;gap:13px}.link{display:flex;align-items:center;gap:16px;padding:19px 20px;border:1px solid #e0e6dc;border-radius:17px;background:#ffffffc9;text-decoration:none;color:inherit;box-shadow:0 5px 22px #3d594009;transition:transform .18s,box-shadow .18s,border-color .18s}.link:hover,.link:focus-visible{transform:translateY(-2px);box-shadow:0 8px 28px #3d59401c;border-color:#b7cbb8;outline:none}.glyph{flex:none;display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:#eaf0e7;color:#526d5d;font-size:22px}.detail{flex:1;min-width:0}.name{font-size:17px;font-weight:650;overflow-wrap:anywhere}.desc{font-size:12px;color:#849087;margin-top:5px;line-height:1.5}.arrow{color:#93a398;font-size:23px}.empty{padding:30px;text-align:center;border:1px dashed #cbd7c9;border-radius:16px;color:#829084;line-height:1.9}footer{text-align:center;color:#9aa59b;font-size:12px;margin-top:45px} @media(prefers-reduced-motion:reduce){.link{transition:none}}@media(max-width:460px){.wrap{padding-top:42px}.link{padding:16px}.name{font-size:16px}}
</style>
</head>
<body><main class="wrap"><header class="top"><div class="seal" aria-hidden="true">随</div><h1>随心的小尝试</h1><p class="subtitle">一点好奇，一点创意。<br>把日常的小灵感，慢慢做成有趣的作品。</p><div class="rule"></div></header><section id="links" class="list" aria-label="我的小作品"></section><footer>随心制作 · 一点一滴，慢慢积累</footer></main>
<script>
// ==========================================================
// EDIT YOUR LINKS HERE. Add, remove or reorder entries.
// title: displayed link name
// url:   complete https:// address
// desc:  optional short description
// icon:  emoji shown on the left
// ==========================================================
const MY_LINKS = [
  { title: '谜条转换器', url: 'https://qrriddles.github.io/mitiao_gen/', desc: '将谜稿制作成灯谜谜条', icon: '🏮' },
  { title: '猜谜乐', url: 'https://qrriddles.github.io/riddles_workshop/', desc: '随时来猜一道灯谜', icon: '🧩' },
  { title: '书法对照', url: 'https://qrriddles.github.io/calligraphy_overlay/', desc: '对照范字与自己的习字', icon: '🖌️' },
  { title: 'Mindflow', url: 'https://qrriddles.github.io/mindflow-/', desc: '把想法整理成思维导图', icon: '🌿' },
];
// ==========================================================
const list=document.getElementById('links');
for(const item of MY_LINKS){
  if(!item.title || !item.url)continue;
  let parsed;try{parsed=new URL(item.url)}catch{continue}
  if(!['https:','http:'].includes(parsed.protocol))continue;
  const a=document.createElement('a');a.className='link';a.href=parsed.href;a.target='_blank';a.rel='noopener noreferrer';
  const glyph=document.createElement('span');glyph.className='glyph';glyph.textContent=item.icon||'✦';glyph.setAttribute('aria-hidden','true');
  const detail=document.createElement('span');detail.className='detail';
  const name=document.createElement('div');name.className='name';name.textContent=item.title;
  detail.append(name);
  if(item.desc){const desc=document.createElement('div');desc.className='desc';desc.textContent=item.desc;detail.append(desc)}
  const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');
  a.append(glyph,detail,arrow);list.append(a);
}
if(!list.children.length){const e=document.createElement('div');e.className='empty';e.textContent='新的小作品，即将在这里出现。';list.append(e)}
</script></body></html>
